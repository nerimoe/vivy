name: Android Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vivy_kiosk
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml | head -n 1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.].*)?$ ]]; then
            echo "Unable to read a semantic app version from pubspec.yaml: $version" >&2
            exit 1
          fi

          short_sha="${GITHUB_SHA:0:7}"
          release_name="${version}+${short_sha}"
          tag="v${release_name}"
          artifact_name="vivy-${release_name}-arm64-v8a.apk"

          latest_tag="$({
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | [.published_at, .tag_name] | @tsv' || true
          } | sort | tail -n 1 | cut -f 2-)"
          latest_version="$(printf '%s' "$latest_tag" | sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')"

          if [[ -z "$latest_version" ]] || dpkg --compare-versions "$version" gt "$latest_version"; then
            release_kind="latest"
            prerelease="false"
            make_latest="true"
          else
            release_kind="pre-release"
            prerelease="true"
            make_latest="false"
          fi

          {
            echo "version=$version"
            echo "release_name=$release_name"
            echo "tag=$tag"
            echo "artifact_name=$artifact_name"
            echo "release_kind=$release_kind"
            echo "prerelease=$prerelease"
            echo "make_latest=$make_latest"
            echo "latest_version=${latest_version:-none}"
          } >> "$GITHUB_OUTPUT"

          echo "${release_name} is a ${release_kind}; latest formal version is ${latest_version:-none}."

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify Flutter source
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Build ARM64 APK
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm64 \
            --build-number="${GITHUB_RUN_NUMBER}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "${{ steps.metadata.outputs.artifact_name }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: apps/vivy_kiosk/${{ steps.metadata.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.release_name }}
          files: apps/vivy_kiosk/${{ steps.metadata.outputs.artifact_name }}
          prerelease: ${{ steps.metadata.outputs.prerelease }}
          make_latest: ${{ steps.metadata.outputs.make_latest }}
          generate_release_notes: true
          body: |
            Vivy Android ARM64 build for `${{ github.sha }}`.

            Release channel: **${{ steps.metadata.outputs.release_kind }}**.
            The version comparison uses the `version:` value in `apps/vivy_kiosk/pubspec.yaml` against the latest non-draft, non-prerelease release.
        env:
          GITHUB_TOKEN: ${{ github.token }}
